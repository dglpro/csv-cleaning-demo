name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node verify.mjs
      - run: node build.mjs && git diff --exit-code -- index.html
